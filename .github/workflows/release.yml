name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    # `branches: [main]` above filters on the triggering run's HEAD branch, so a
    # fork PR from a branch named `main` passes it. Only a push to this repo's
    # own main may release: a `pull_request` CI run (fork or not) never does.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: btravstack/tools/.github/workflows/release-reusable.yml@022bb36b7955698e6b813d27bacdf0c88ed70be1 # workflows-v1
    with:
      # The exact commit the green CI run measured. Without it a `workflow_run`
      # checkout takes the default branch's CURRENT tip, which a push landing
      # after CI went green can have moved — publishing a permanent tarball
      # from a commit no CI run validated.
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
