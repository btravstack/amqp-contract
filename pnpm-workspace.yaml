  "@arethetypeswrong/cli": 0.18.5
  "@asyncapi/parser": 3.6.1
  "@btravstack/commitlint": 0.1.0
  "@btravstack/lefthook": 0.1.1
  "@btravstack/oxlint": 0.2.1
  "@btravstack/theme": 2.0.0
  "@btravstack/tsconfig": 0.2.0
  "@btravstack/typedoc": 0.1.0
  "@changesets/cli": 2.31.1
  "@commitlint/cli": 21.2.1
  "@opentelemetry/api": 1.9.1
  "@orpc/arktype": 1.14.8
  "@orpc/openapi": 1.14.13
  "@orpc/valibot": 1.14.8
  "@orpc/zod": 1.14.8
  "@standard-schema/spec": 1.1.0
  "@types/node": 26.1.2
  "@unthrown/oxlint": 5.5.0
  "@unthrown/standard-schema": 5.5.0
  "@unthrown/vitest": 5.5.0
  "@vitest/coverage-v8": 4.1.10
  amqp-connection-manager: 5.0.0
  amqplib: 2.0.1
  arktype: 2.2.3
  fast-check: 4.9.0
  knip: 6.31.0
  lefthook: 2.1.10
  mermaid: 11.16.1
  oxfmt: 0.62.0
  oxlint: 1.77.0
  pino: 10.3.1
  pino-pretty: 13.1.3
  publint: 0.3.22
  testcontainers: 12.0.4
  tsdown: 0.22.14
  tsx: 4.23.5
  turbo: 2.10.8
  typedoc: 0.28.20
  typedoc-plugin-markdown: 4.12.0
  typescript: 6.0.3
  unthrown: 5.5.0
  valibot: 1.4.2
  vitepress: 1.6.4
  vitepress-plugin-mermaid: 2.0.17
  vitest: 4.1.10
