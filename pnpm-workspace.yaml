peerDependencyRules:
  ignoreMissing:
    # Optional analytics peer of VitePress's bundled Algolia DocSearch.
    - search-insights

# Force patched versions of vulnerable transitive dependencies. The `@major`
# selectors pull each affected version line up to its first fixed release
# without disturbing unrelated lines. All of these reach us only through
# dev/build/test tooling.
overrides:
  # GHSA-v2hh-gcrm-f6hx (High): fast-uri host confusion via literal backslash
  # authority delimiter, and GHSA-7p8r-x3mc-p8w7 (High): the same class of host
  # confusion via backslash, which 3.1.4 did not fully close. Only the
  # vulnerable line is present (transitive, via ajv under commitlint/prisma
  # tooling); 3.1.5 is the first release patched against both. Reaches us only
  # through dev/build tooling.
  "fast-uri@<3.1.5": "3.1.5"
  # GHSA-4cwx-7wf7-3272 (High): undici cross-user information disclosure.
  # Reaches us only through packages/testing > testcontainers, i.e. the
  # integration-test harness, never a published package's runtime. 8.9.0 is the
  # first patched release.
  "undici@<8.9.0": "8.9.0"
  # GHSA-3jxr-9vmj-r5cp (High, ReDoS) + GHSA-mh99-v99m-4gvg (High, DoS via
  # unbounded expansion length) + GHSA-rgw5-rvv9-x895 (High, DoS via unbounded
  # intermediate arrays, bypassing the CVE-2026-14257 mitigation):
  # brace-expansion. Three distinct lines are present: 1.x via @asyncapi/parser
  # > spectral, 2.x via testcontainers > archiver, and 5.x via typedoc >
  # minimatch. All three lines are pulled to their first GHSA-rgw5-patched
  # release. GHSA-mh99 still has no patched 1.x/2.x release (its vulnerable
  # range is <=5.0.7), so that advisory remains ignored via
  # auditConfig.ignoreGhsas below rather than force-upgrading across majors.
  "brace-expansion@1": "1.1.18"
  "brace-expansion@2": "2.1.4"
  "brace-expansion@5": "5.0.9"
  # GHSA-52cp-r559-cp3m (High) + GHSA-h67p-54hq-rp68 (moderate): js-yaml
  # quadratic-CPU / merge-key issues. The legacy 3.x line arrives via
  # @changesets/cli > read-yaml-file; the 4.x line via @changesets/cli >
  # @changesets/parse and @asyncapi/parser. Both pulled to their patched release.
  #
  # Raised to 3.15.1 / 4.3.1 for GHSA-5p4m-2wfm-xmqj (High), a later advisory on
  # the same package that 3.15.0 / 4.3.0 predate.
  "js-yaml@3": "3.15.1"
  "js-yaml@4": "4.3.1"
  # GHSA-2v37-7h3g-55p8 (High): nanoid custom generators can loop indefinitely
  # when size is zero. Reaches us only through the docs build —
  # docs > @btravstack/theme > vitepress > postcss > nanoid — never the shipped
  # package. The advisory later widened to <3.3.18, so the floor moves with it.
  "nanoid@<3.3.18": "3.3.18"
  # GHSA-fx2h-pf6j-xcff (High) + GHSA-v6wh-96g9-6wx3 / GHSA-4w7w-66w2-5vf9 /
  # GHSA-67mh-4wv8-2f99 (moderate): vite `server.fs.deny` bypass + esbuild
  # dev-server CORS (dev-server only; the docs ship as static HTML). Reaches us
  # via docs > vitepress > vite. vitepress 1.6.x pins vite ^5.4.14 with no
  # patched 5.x, so lift any pre-6.4.3 vite to 6.4.3 (first fixed release) — this
  # also drags esbuild up to a patched 0.25.x. The `vitepress build` is verified
  # against it.
  "vite@<6.4.3": "6.4.3"
  # GHSA-cmwh-pvxp-8882 (moderate) + GHSA-vxr8-fq34-vvx9 (low) +
  # GHSA-c2j3-45gr-mqc4 (low, CUSTOM_ELEMENT_HANDLING bypass) +
  # GHSA-55q2-fjhq-7xh7 (moderate): dompurify XSS / mXSS /
  # afterSanitizeElements bypass, via docs > mermaid > dompurify.
  # 3.4.13 is the first release patched for GHSA-55q2.
  dompurify: 3.4.13
  # GHSA-j3f2-48v5-ccww (moderate): protobufjs prototype pollution, via
  # packages/testing > testcontainers > dockerode > @grpc/proto-loader. 7.6.5 is
  # the first fixed release.
  protobufjs: 7.6.5
  # Keep @types/node pinned to the catalog major (26.x) everywhere — dev tooling
  # would otherwise pull other @types/node lines transitively. Types-only, so no
  # runtime effect. `catalog:` keeps it in sync with the catalog entry above.
  "@types/node": "catalog:"

# Supply-chain maturity delay: don't adopt a freshly published version until it
# has been on the registry for 7 days (10080 minutes). Strict mode also validates
# the committed lockfile against this cutoff.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# First-party (btravstack) packages are exempt from the maturity gate so freshly
# published versions can be adopted immediately.
minimumReleaseAgeExclude:
  - "@btravstack/commitlint"
  - "@btravstack/lefthook"
  - "@btravstack/oxlint"
  - "@btravstack/theme"
  - "@btravstack/tsconfig"
  - "@btravstack/typedoc"
  - unthrown
  - "@unthrown/oxlint"
  - "@unthrown/standard-schema"
  - "@unthrown/vitest"
  # Temporary: brace-expansion 1.1.18 / 2.1.4 / 5.0.9 (the GHSA-rgw5-rvv9-x895
  # overrides above) are younger than the 7-day cutoff (all published
  # 2026-07-30). Remove once they are 7 days old (i.e. after 2026-08-06).
  - brace-expansion
  # Temporary: fast-uri 3.1.5 (the GHSA-7p8r-x3mc-p8w7 override above) was
  # published 2026-07-31, inside the 7-day cutoff. It is the only release
  # patched against that advisory, so the choice was a young release or a known
  # High. Remove this entry once it is 7 days old (i.e. after 2026-08-07).
  # undici 8.9.0 needs no entry — published 2026-07-24, already past the cutoff.
  - fast-uri
  # Temporary: nanoid 3.3.18 (the widened GHSA-2v37-7h3g-55p8 override above)
  # was published 2026-08-07, inside the 7-day cutoff. Remove once it is 7 days
  # old (i.e. after 2026-08-14). dompurify 3.4.13 needs no entry — published
  # 2026-08-03, past the cutoff.
  - nanoid

# GHSA-mh99-v99m-4gvg (brace-expansion DoS via unbounded expansion length) has a
# patched release ONLY on the 5.x line (>=5.0.8); the 1.x/2.x lines resolved
# under @asyncapi/parser > spectral and testcontainers > archiver have no patched
# release, and forcing them to 5.x across majors is unsafe. Accepted risk: the
# expansion input at those sites is library-internal glob patterns, never user
# input. Remove this ignore if upstream ships patched 1.x/2.x releases for GHSA-mh99
# (distinct from GHSA-rgw5-rvv9-x895, which is already handled by the overrides above).
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

allowBuilds:
  cpu-features: true
  esbuild: true
  lefthook: true
  protobufjs: true
  ssh2: true
